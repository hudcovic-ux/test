version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ccs:${DB_PASSWORD:-password}@db:5432/ccs
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - YOUTRACK_URL=${YOUTRACK_URL}
      - YOUTRACK_TOKEN=${YOUTRACK_TOKEN}
      - YOUTRACK_WEBHOOK_SECRET=${YOUTRACK_WEBHOOK_SECRET}
      - YOUTRACK_CLIENT_FIELD=${YOUTRACK_CLIENT_FIELD:-Client}
      - YOUTRACK_PROJECT_ID=${YOUTRACK_PROJECT_ID:-0-0}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-CCS Portal <noreply@example.com>}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ccs-network

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ccs
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=ccs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccs -d ccs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ccs-network

  # Optional: Database migration runner
  migrate:
    build: .
    command: npx prisma migrate deploy
    environment:
      - DATABASE_URL=postgresql://ccs:${DB_PASSWORD:-password}@db:5432/ccs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ccs-network
    profiles:
      - migration

volumes:
  postgres_data:

networks:
  ccs-network:
    driver: bridge
